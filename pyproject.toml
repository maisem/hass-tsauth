[project]
name = "ha-tsidp"
version = "0.2.1"
description = "Tailscale Serve identity authentication for Home Assistant"
requires-python = ">=3.12"
dependencies = [
    "Authlib==1.9.1",
    "httpx2==2.13.0",
    "joserfc==1.7.5",
]

[dependency-groups]
dev = [
    "aiohttp>=3.12,<4",
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.11,<1",
    "voluptuous>=0.15,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
